name: godot-release-check

on:  # yamllint disable-line rule:truthy
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report the result and verify the edits only, do not create issues or pull requests.'
        required: false
        type: boolean
        default: false
  pull_request:
    paths:
      - '.github/workflows/godot-release-check.yml'
      - 'godot-release-check/**'

permissions: {}

concurrency:
  group: godot-release-check-${{ github.ref }}
  cancel-in-progress: true

env:
  LLM_MODEL: 'gemini-3.5-flash'
  REPOSITORIES: 'gdUnit4,gdUnit4Net,gdUnit4NetExamples,gdUnit4-action'
  ISSUE_ASSIGNEE: 'MikeSchulze'
  PULL_LABELS: 'Exclude from release notes'

jobs:
  test:
    name: 'Test the release check'
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 'Setup Node.js'
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: 'Install the dependencies'
        run: npm ci --prefix godot-release-check --ignore-scripts --no-audit --no-fund

      - name: 'Run the tests'
        run: node --test 'godot-release-check/*.test.mjs'

  check:
    name: 'Check for new Godot releases'
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 'Setup Node.js'
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: 'Install the dependencies'
        run: npm ci --prefix godot-release-check --ignore-scripts --no-audit --no-fund

      - name: 'Create the bot token'
        id: app-token
        if: vars.GDUNIT_BOT_APP_ID != '' && (github.event_name != 'workflow_dispatch' || !inputs.dry_run)
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.GDUNIT_BOT_APP_ID }}
          private-key: ${{ secrets.GDUNIT_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ env.REPOSITORIES }}
          permission-issues: write
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
          permission-organization-projects: write

      - name: 'Check the repositories'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BOT_TOKEN: ${{ steps.app-token.outputs.token }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: node godot-release-check/check.mjs
